#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

env:
  # ADBC Snowflake driver from the ADBC Driver Foundry (adbc-drivers/snowflake,
  # release line go/vX.Y.Z). The apache/arrow-adbc wheels are deprecated and lack
  # GeoArrow GEOGRAPHY/GEOMETRY support (shipped in go/v1.11.0).
  ADBC_DRIVER_VERSION: "1.11.0"

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    permissions:
      contents: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: snowflake
      skip_tests: true  # Tests run in separate workflow with Snowflake credentials
    secrets: inherit

  code-quality-check:
    name: Code Quality Check
    permissions:
      contents: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: snowflake
      format_checks: 'format;tidy'
    secrets: inherit

  build-complete-packages:
    name: Build complete extension package
    needs: [duckdb-stable-build, code-quality-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false  # Continue building other platforms even if one fails
      matrix:
        # No osx_amd64: the ADBC Driver Foundry ships no macOS x86_64 (Intel)
        # build. Intel macOS users must build the driver from source and set
        # SNOWFLAKE_ADBC_DRIVER_PATH (the bare extension still builds for it).
        platform:
          - name: linux_amd64
            driver_asset: linux_amd64
            lib_in_tarball: libadbc_driver_snowflake.so
          - name: linux_arm64
            driver_asset: linux_arm64
            lib_in_tarball: libadbc_driver_snowflake.so
          - name: osx_arm64
            driver_asset: macos_arm64
            lib_in_tarball: libadbc_driver_snowflake.dylib
          - name: windows_amd64
            driver_asset: windows_amd64
            lib_in_tarball: libadbc_driver_snowflake.dll
          - name: windows_amd64_mingw
            driver_asset: windows_amd64
            lib_in_tarball: libadbc_driver_snowflake.dll
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: snowflake-v1.5.5-extension-${{ matrix.platform.name }}
          path: ./extension-artifact

      - name: Download ADBC driver
        run: |
          mkdir -p adbc_driver
          cd adbc_driver
          ASSET="snowflake_${{ matrix.platform.driver_asset }}_v${{ env.ADBC_DRIVER_VERSION }}.tar.gz"
          ASSET_URL="https://github.com/adbc-drivers/snowflake/releases/download/go/v${{ env.ADBC_DRIVER_VERSION }}/$ASSET"
          echo "Downloading ADBC driver from: $ASSET_URL"
          if ! wget -q "$ASSET_URL"; then
            echo "ERROR: Failed to download ADBC driver tarball: $ASSET"
            exit 1
          fi
          if ! tar xzf "$ASSET"; then
            echo "ERROR: Failed to extract ADBC driver tarball: $ASSET"
            exit 1
          fi
          # The extension resolves the driver by the fixed name
          # libadbc_driver_snowflake.so on every platform (see CMakeLists.txt),
          # so normalize the macOS .dylib / Windows .dll to that name.
          LIB="${{ matrix.platform.lib_in_tarball }}"
          if [ ! -f "$LIB" ]; then
            FOUND="$(find . -name "$LIB" -type f | head -1)"
            if [ -z "$FOUND" ]; then
              echo "ERROR: $LIB not found in $ASSET"
              exit 1
            fi
            mv "$FOUND" "$LIB"
          fi
          if [ "$LIB" != "libadbc_driver_snowflake.so" ]; then
            mv "$LIB" libadbc_driver_snowflake.so
          fi
          ls -lah libadbc_driver_snowflake.so

      - name: Create complete package
        run: |
          mkdir -p package/snowflake
          
          # Copy extension file
          EXTENSION_FILE=$(find extension-artifact -name "*.duckdb_extension" | head -n 1)
          if [ -z "$EXTENSION_FILE" ]; then
            echo "ERROR: No .duckdb_extension file found in extension-artifact"
            exit 1
          fi
          cp "$EXTENSION_FILE" package/snowflake/
          echo "Copied extension file: $EXTENSION_FILE"
          
          # Copy ADBC driver (already normalized to the fixed name the
          # extension searches for on every platform)
          if [ ! -f adbc_driver/libadbc_driver_snowflake.so ]; then
            echo "ERROR: ADBC driver not found: adbc_driver/libadbc_driver_snowflake.so"
            exit 1
          fi
          cp adbc_driver/libadbc_driver_snowflake.so package/snowflake/
          echo "Copied ADBC driver"
          
          echo "Package contents before zipping:"
          ls -lah package/snowflake/
          
          # Create zip archive
          cd package
          ZIP_FILE="../snowflake-extension-1.5.5-${{ matrix.platform.name }}.zip"
          if ! zip -r "$ZIP_FILE" snowflake/; then
            echo "ERROR: Failed to create zip archive"
            exit 1
          fi
          cd ..
          
          # Display package info
          echo "Package contents:"
          unzip -l snowflake-extension-1.5.5-${{ matrix.platform.name }}.zip
          echo ""
          echo "Package size:"
          ls -lh snowflake-extension-1.5.5-${{ matrix.platform.name }}.zip
          
      - name: Validate package size
        run: |
          PACKAGE_FILE="snowflake-extension-1.5.5-${{ matrix.platform.name }}.zip"
          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "ERROR: Package file not found: $PACKAGE_FILE"
            exit 1
          fi
          
          PACKAGE_SIZE=$(stat -f%z "$PACKAGE_FILE" 2>/dev/null || stat -c%s "$PACKAGE_FILE")
          MIN_SIZE=$((10 * 1024 * 1024))  # 10MB minimum (ADBC driver is ~20MB)
          
          if [ $PACKAGE_SIZE -lt $MIN_SIZE ]; then
            echo "ERROR: Package size ($PACKAGE_SIZE bytes) is too small. Expected at least $MIN_SIZE bytes."
            echo "This indicates the ADBC driver may be missing."
            exit 1
          fi
          
          # Calculate size in MB (using awk if bc is not available)
          SIZE_MB=$(echo "scale=2; $PACKAGE_SIZE / 1024 / 1024" | bc 2>/dev/null || awk "BEGIN {printf \"%.2f\", $PACKAGE_SIZE / 1024 / 1024}")
          echo "Package size validation passed: ${SIZE_MB}MB"
          
      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: snowflake-extension-1.5.5-${{ matrix.platform.name }}
          path: snowflake-extension-1.5.5-${{ matrix.platform.name }}.zip
          retention-days: 30
          if-no-files-found: error

  windows-live-query:
    name: Windows live query (shipped package)
    # Issue #70: no other job runs a query on Windows. This one drives the exact
    # package a user downloads (extension + driver side by side) through the
    # stock DuckDB CLI. Every check runs under a hard timeout via
    # scripts/windows_live_query.ps1, so a CLI that never exits (issue #69)
    # fails the step with a thread dump attached instead of running into the
    # six hour job limit. Checks 2 and 3 need the Snowflake secrets and skip
    # cleanly without them, so forks stay green; check 1 always runs.
    needs: [build-complete-packages]
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download complete package
        uses: actions/download-artifact@v4
        with:
          name: snowflake-extension-1.5.5-windows_amd64
          path: package

      - name: Unpack package and DuckDB CLI
        shell: pwsh
        run: |
          Expand-Archive package\snowflake-extension-1.5.5-windows_amd64.zip -DestinationPath package -Force
          Get-ChildItem package\snowflake | Format-Table Name, Length
          curl.exe -sL -o duckdb_cli.zip "https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-windows-amd64.zip"
          Expand-Archive duckdb_cli.zip -DestinationPath cli -Force
          .\cli\duckdb.exe --version

      # Same contract as the macOS job in test-with-snowflake.yml: vars are
      # exported only when usable. SNOWFLAKE_LIVE gates the credentialed checks.
      - name: Set up Snowflake key-pair auth
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_KEYPAIR_USER: ${{ secrets.SNOWFLAKE_KEYPAIR_USER }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ] || [ -z "$SNOWFLAKE_DATABASE" ] || [ -z "$SNOWFLAKE_PRIVATE_KEY" ]; then
            echo "Snowflake secrets not set; live checks will skip."
            exit 0
          fi
          TMP_M="$(cygpath -m "$RUNNER_TEMP")"
          KEY_PATH="$TMP_M/sf_key.p8"
          if printf '%s' "$SNOWFLAKE_PRIVATE_KEY" | head -c 32 | grep -q "BEGIN"; then
            printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY" | openssl base64 -d -A > "$KEY_PATH"
          fi
          if grep -q "ENCRYPTED" "$KEY_PATH" && [ -z "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" ]; then
            echo "Key is encrypted but SNOWFLAKE_PRIVATE_KEY_PASSPHRASE is not set; live checks will skip."
            rm -f "$KEY_PATH"
            exit 0
          fi
          KP_USER="${SNOWFLAKE_KEYPAIR_USER:-$SNOWFLAKE_USERNAME}"
          {
            echo "SNOWFLAKE_LIVE=true"
            echo "SNOWFLAKE_PRIVATE_KEY_FILE=$KEY_PATH"
            echo "SNOWFLAKE_KEYPAIR_USER=$KP_USER"
            echo "SNOWFLAKE_PRIVATE_KEY_PASSWORD_FILE=$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
          } >> "$GITHUB_ENV"
          echo "Key-pair auth configured; live checks will run."

      # The SQL files hold the account and key location, so they live in
      # RUNNER_TEMP, are never printed, and are removed in the cleanup step.
      - name: Write check SQL
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          WS_M="$(cygpath -m "$GITHUB_WORKSPACE")"
          TMP_M="$(cygpath -m "$RUNNER_TEMP")"
          EXT="$WS_M/package/snowflake/snowflake.duckdb_extension"
          printf "LOAD '%s';\nSELECT snowflake_version();\n" "$EXT" > "$TMP_M/check1.sql"
          if [ "${SNOWFLAKE_LIVE:-}" != "true" ]; then
            exit 0
          fi
          SECRET="CREATE SECRET sf (TYPE snowflake, ACCOUNT '$SNOWFLAKE_ACCOUNT', USER '$SNOWFLAKE_KEYPAIR_USER', AUTH_TYPE 'key_pair', PRIVATE_KEY_FILE '$SNOWFLAKE_PRIVATE_KEY_FILE', PRIVATE_KEY_PASSWORD '$SNOWFLAKE_PRIVATE_KEY_PASSWORD_FILE', DATABASE '$SNOWFLAKE_DATABASE', WAREHOUSE 'COMPUTE_WH');"
          printf "LOAD '%s';\n%s\nSELECT * FROM snowflake_query('SELECT 42 AS answer', 'sf');\n" "$EXT" "$SECRET" > "$TMP_M/check2.sql"
          printf "LOAD '%s';\n%s\nATTACH '' AS sf_db (TYPE snowflake, SECRET sf, READ_ONLY);\nSELECT count(n_nationkey) FROM sf_db.tpch_sf1.nation;\n" "$EXT" "$SECRET" > "$TMP_M/check3.sql"

      - name: Check 1, load and snowflake_version()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows_live_query.ps1" -DuckDb "$env:GITHUB_WORKSPACE\cli\duckdb.exe" `
            -SqlFile "$env:RUNNER_TEMP\check1.sql" -Label check1-version -Expect "Snowflake Extension v"

      - name: Check 2, snowflake_query() then exit
        if: env.SNOWFLAKE_LIVE == 'true'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows_live_query.ps1" -DuckDb "$env:GITHUB_WORKSPACE\cli\duckdb.exe" `
            -SqlFile "$env:RUNNER_TEMP\check2.sql" -Label check2-snowflake-query -Expect "42"

      # always(): this is the control for check 2, so it must run even when
      # check 2 fails. The job still fails on check 2.
      - name: Check 3, ATTACH then exit
        if: always() && env.SNOWFLAKE_LIVE == 'true'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows_live_query.ps1" -DuckDb "$env:GITHUB_WORKSPACE\cli\duckdb.exe" `
            -SqlFile "$env:RUNNER_TEMP\check3.sql" -Label check3-attach -Expect "25"

      - name: Upload thread dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-live-query-thread-dumps
          path: ${{ runner.temp }}/*-threads.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove private key and check SQL
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sf_key.p8" "$RUNNER_TEMP"/check*.sql
